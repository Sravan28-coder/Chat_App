<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Chat App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background: #fff;
      color: #333;
      width: 100%;
      max-width: 500px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .chat-header {
      background-color: #4a00e0;
      padding: 15px;
      text-align: center;
      font-size: 1.5rem;
      color: #fff;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      list-style-type: none;
      margin: 0;
    }

    #messages li {
      padding: 10px 15px;
      margin-bottom: 10px;
      background-color: #e4e6eb;
      border-radius: 20px;
      max-width: 80%;
      word-wrap: break-word;
    }

    #messages li.self {
      background-color: #d1ffd6;
      margin-left: auto;
    }

    .chat-form {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
      background: #f9f9f9;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 1rem;
    }

    button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #4a00e0;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3c00b2;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">💬 Real-Time Chat</div>
    <ul id="messages"></ul>
    <form id="form" class="chat-form">
      <input id="input" type="text" autocomplete="off" placeholder="Type your message..." />
      <button>Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
